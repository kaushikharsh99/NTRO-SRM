[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntro-srm"
version = "0.1.0"
description = "Deep Learning Based Super-Resolution Mapping from Medium Resolution Satellite Imageries (Sentinel-2 10m -> 2.5m GSD)"
readme = "README.md"
authors = [{ name = "NTRO-SRM Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["super-resolution", "sentinel-2", "remote-sensing", "gis", "pytorch", "geotiff", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.0",
    "safetensors>=0.4.0",
    "mlstac>=0.4.0",
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "pillow>=9.5.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
ntro-srm-web = "ntro_srm.web.app:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.html", "*.css", "*.js", "*.png", "*.jpg", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", "datasets", "experiments", "checkpoints", "venv", ".venv"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
